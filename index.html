
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bali Driver & Guide - Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f9;color:#263238}
header{background:#123b35;color:white;padding:18px 24px}
header h2{margin:0;font-size:21px}
header p{margin:6px 0 0;color:#d7e8e2;font-size:13px}
.container{max-width:1150px;margin:25px auto;padding:0 15px}
.card{background:white;border-radius:12px;padding:22px;margin-bottom:20px;box-shadow:0 3px 14px #0000000c}
h3{margin:0 0 18px;color:#174c40}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccd3d9;border-radius:7px;font-size:14px;background:white}
textarea{min-height:75px;resize:vertical}
label{display:block;font-size:13px;font-weight:bold;margin:12px 0 6px}
button{border:0;border-radius:7px;padding:11px 17px;cursor:pointer;font-weight:bold;font-size:14px}
.primary{background:#176b50;color:white}
.secondary{background:#e8edf0;color:#263238}
.danger{background:#b83232;color:white}
button:hover{opacity:.88}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hidden{display:none!important}
#message{margin-top:12px;font-size:14px}
.success{color:#137547}
.error{color:#b83232}
table{width:100%;border-collapse:collapse;min-width:750px}
th,td{text-align:left;padding:12px;border-bottom:1px solid #e7eaed;font-size:13px}
th{background:#f5f7f8;color:#42534e}
.table-wrap{overflow-x:auto}
.login{max-width:420px;margin:70px auto;padding:15px}
.login .card{padding:28px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.small{font-size:12px;color:#68757b}
#total{font-size:25px;font-weight:bold;color:#176b50}
@media(max-width:650px){.grid{grid-template-columns:1fr}.container{margin:15px auto}.card{padding:16px}header{padding:16px}}
</style>
</head>
<body>

<header>
  <h2>Bali Driver & Guide</h2>
  <p>Dashboard Administrasi Driver</p>
</header>

<div id="loginPage" class="login">
  <div class="card">
    <h3>Login Admin</h3>
    <label>Email Admin</label>
    <input id="email" type="email" placeholder="Masukkan email Admin">
    <label>Password</label>
    <input id="password" type="password" placeholder="Masukkan password">
    <div class="actions">
      <button class="primary" style="width:100%" onclick="login()">MASUK</button>
    </div>
    <div id="loginMessage"></div>
  </div>
</div>

<div id="dashboard" class="container hidden">

  <div class="card topbar">
    <div>
      <h3 style="margin:0">Dashboard Admin</h3>
      <div class="small" id="adminEmail"></div>
    </div>
    <button class="danger" onclick="logout()">KELUAR</button>
  </div>

  <div class="card">
    <div class="small">JUMLAH DATA DRIVER</div>
    <div id="total">0</div>
  </div>

  <div class="card">
    <h3 id="formTitle">Input Data Driver</h3>
    <input type="hidden" id="driverId">

    <div class="grid">
      <div>
        <label>Nama Driver *</label>
        <input id="nama" placeholder="Nama lengkap">
      </div>
      <div>
        <label>Nomor WhatsApp *</label>
        <input id="whatsapp" placeholder="Contoh: 628123456789">
      </div>
      <div>
  <label>Kabupaten / Kota</label>
  <select id="kabupaten">
    <option value="">Pilih Kabupaten / Kota</option>
    <option value="Badung">Kabupaten Badung</option>
    <option value="Bangli">Kabupaten Bangli</option>
    <option value="Buleleng">Kabupaten Buleleng</option>
    <option value="Gianyar">Kabupaten Gianyar</option>
    <option value="Jembrana">Kabupaten Jembrana</option>
    <option value="Karangasem">Kabupaten Karangasem</option>
    <option value="Klungkung">Kabupaten Klungkung</option>
    <option value="Tabanan">Kabupaten Tabanan</option>
    <option value="Denpasar">Kota Denpasar</option>
  </select>
</div>
      <div>
        <label>Alamat</label>
        <input id="alamat" placeholder="Alamat driver">
      </div>
      <div>
        <label>Jenis Kendaraan</label>
        <input id="kendaraan" placeholder="Contoh: Avanza">
      </div>
      <div>
        <label>Nomor Polisi</label>
        <input id="plat" placeholder="Contoh: DK 1234 AB">
      </div>
      <div>
        <label>Nomor SIM</label>
        <input id="sim" placeholder="Nomor SIM">
      </div>
      <div>
        <label>Jumlah Tamu</label>
        <input id="jumlah_tamu" type="number" min="0" placeholder="Jumlah tamu">
      </div>
      <div>
        <label>Asal Tamu</label>
        <input id="asal_tamu" placeholder="Negara asal tamu">
      </div>
      <div>
        <label>Tamu Menginap Di</label>
        <input id="tamu_menginap_di" placeholder="Nama hotel / lokasi">
      </div>
      <div>
        <label>Status Driver</label>
        <input id="status" placeholder="Status driver">
      </div>
    </div>

    <div class="actions">
      <button class="primary" onclick="saveDriver()">SIMPAN DATA</button>
      <button class="secondary" onclick="resetForm()">BATAL / KOSONGKAN</button>
    </div>
    <div id="formMessage"></div>
  </div>

  <div class="card">
    <div class="topbar">
      <h3>Database Driver</h3>
      <button class="secondary" onclick="loadDrivers()">MUAT ULANG</button>
    </div>
    <label>Cari Data Driver</label>
    <input id="search" placeholder="Cari nama, WhatsApp, kabupaten, kendaraan, atau plat..." oninput="renderDrivers()">
    <div class="small" id="listMessage" style="margin:12px 0"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>No.</th>
            <th>Nama</th>
            <th>WhatsApp</th>
            <th>Kabupaten</th>
            <th>Kendaraan</th>
            <th>Plat</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="driverRows">
          <tr><td colspan="8">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
const CONFIG = {
  SUPABASE_URL: "https://wssbbcygkikepyhzudvf.supabase.co",
  SUPABASE_ANON_KEY: "sb_publishable_22gvj7q_JkIRTvCiUAUooQ_XSHdKUeq"
};

const db = window.supabase.createClient(
  CONFIG.SUPABASE_URL,
  CONFIG.SUPABASE_ANON_KEY
);

let drivers = [];

function message(id, text, type="") {
  const el = document.getElementById(id);
  el.className = type;
  el.textContent = text;
}

async function checkAdmin(user) {
  const {data, error} = await db
    .from("profiles")
    .select("role")
    .eq("id", user.id)
    .single();

  if (error || !data || data.role !== "admin") {
    await db.auth.signOut();
    document.getElementById("dashboard").classList.add("hidden");
    document.getElementById("loginPage").classList.remove("hidden");
    message("loginMessage", "Akun ini tidak memiliki akses Admin.", "error");
    return false;
  }

  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  document.getElementById("adminEmail").textContent = user.email || "";
  await loadDrivers();
  return true;
}

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    message("loginMessage", "Email dan password wajib diisi.", "error");
    return;
  }

  message("loginMessage", "Sedang memeriksa akun...");
  const {data, error} = await db.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    message("loginMessage", "Login gagal: " + error.message, "error");
    return;
  }

  await checkAdmin(data.user);
}

async function logout() {
  await db.auth.signOut();
  drivers = [];
  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");
  document.getElementById("password").value = "";
  message("loginMessage", "Anda sudah keluar.", "success");
}

async function loadDrivers() {
  message("listMessage", "Memuat data driver...");
  const {data, error} = await db
    .from("drivers")
    .select("id,name,phone,kabupaten,address,vehicle_type,plate_no,license_no,jumlah_tamu,asal_tamu,tamu_menginap_di,status,created_at")
    .order("created_at", {ascending:false});

  if (error) {
    message("listMessage", "Gagal memuat data: " + error.message, "error");
    return;
  }

  drivers = data || [];
  document.getElementById("total").textContent = drivers.length;
  renderDrivers();
}
function renderDrivers() {
  const keyword = document.getElementById("search").value.toLowerCase().trim();

  const filtered = drivers.filter(d => [
    d.name,
    d.phone,
    d.kabupaten,
    d.vehicle_type,
    d.plate_no
  ].some(v => String(v || "").toLowerCase().includes(keyword)));

  const tbody = document.getElementById("driverRows");

  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="8">Data tidak ditemukan.</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map((d, i) => `
    <tr>
      <td>${i+1}</td>
      <td>${escapeHTML(d.name)}</td>
      <td>${escapeHTML(d.phone)}</td>
      <td>${escapeHTML(d.kabupaten)}</td>
      <td>${escapeHTML(d.vehicle_type)}</td>
      <td>${escapeHTML(d.plate_no)}</td>
      <td>${escapeHTML(d.status)}</td>
      <td>
        <button class="secondary" onclick="editDriver('${d.id}')">Edit</button>
        <button class="danger" onclick="deleteDriver('${d.id}')">Hapus</button>
      </td>
    </tr>
  `).join("");

  message("listMessage", "Menampilkan " + filtered.length + " dari " + drivers.length + " data.");
}


 
tbody.innerHTML = filtered.map((d, i) => `
    <tr>
      <td>${i+1}</td>
      <td>${escapeHTML(d.name)}</td>
      <td>${escapeHTML(d.phone)}</td>
      <td>${escapeHTML(d.kabupaten)}</td>
      <td>${escapeHTML(d.vehicle_type)}</td>
      <td>${escapeHTML(d.plate_no)}</td>
      <td>${escapeHTML(d.status)}</td>
      <td>
        <button class="secondary" onclick="editDriver('${d.id}')">Edit</button>
        <button class="danger" onclick="deleteDriver('${d.id}')">Hapus</button>
      </td>
    </tr>
  `).join("");

  message("listMessage", "Menampilkan " + filtered.length + " dari " + drivers.length + " data.");
}


function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}


function getFormData() {
  return {
    name: document.getElementById("nama").value.trim(),
    phone: document.getElementById("whatsapp").value.trim(),
    kabupaten: document.getElementById("kabupaten").value.trim(),
    address: document.getElementById("alamat").value.trim(),
    vehicle_type: document.getElementById("kendaraan").value.trim(),
    plate_no: document.getElementById("plat").value.trim(),
    license_no: document.getElementById("sim").value.trim(),
    jumlah_tamu: document.getElementById("jumlah_tamu").value === ""
      ? null : Number(document.getElementById("jumlah_tamu").value),
    asal_tamu: document.getElementById("asal_tamu").value.trim(),
    tamu_menginap_di: document.getElementById("tamu_menginap_di").value.trim(),
    status: document.getElementById("status").value.trim()
  };
}

async function saveDriver() {
  const record = getFormData();
  const id = document.getElementById("driverId").value;

  if (!record.name || !record.phone) {
    message("formMessage", "Nama dan WhatsApp wajib diisi.", "error");
    return;
  }

  message("formMessage", "Menyimpan data...");

  let result;

  if (id) {
    result = await db
      .from("drivers")
      .update(record)
      .eq("id", id);
  } else {
    result = await db
      .from("drivers")
      .insert([record]);
  }

  if (result.error) {
    message("formMessage", "Gagal menyimpan data: " + result.error.message, "error");
    return;
  }

  message("formMessage", "Data driver berhasil disimpan.", "success");

  document.getElementById("driverId").value = "";
  document.getElementById("form").reset();
  document.getElementById("formTitle").textContent = "Tambah Data Driver";

  await loadDrivers();
}

  message("formMessage", "Menyimpan data...");
  let result;

  if (id) {
    result = await db.from("drivers").update(record).eq("id", id);
  } else {
    result = await db.from("drivers").insert([record]);
  }

  if (result.error) {
    message("formMessage", "Gagal menyimpan: " + result.error.message, "error");
    return;
  }

  message("formMessage", "Data berhasil disimpan.", "success");
  resetForm();
  await loadDrivers();
}

function editDriver(id) {
  const d = drivers.find(item => String(item.id) === String(id));
  if (!d) return;

  document.getElementById("driverId").value = d.id;

  const fields = {
    nama: d.name,
    whatsapp: d.phone,
    kabupaten: d.kabupaten,
    alamat: d.address,
    kendaraan: d.vehicle_type,
    plat: d.plate_no,
    sim: d.license_no,
    jumlah_tamu: d.jumlah_tamu,
    asal_tamu: d.asal_tamu,
    tamu_menginap_di: d.tamu_menginap_di,
    status: d.status
  };

  Object.entries(fields).forEach(([key, value]) => {
    document.getElementById(key).value = value ?? "";
  });

  document.getElementById("formTitle").textContent = "Edit Data Driver";
  document.getElementById("formMessage").textContent = "Mode edit data driver.";
  window.scrollTo({top:0, behavior:"smooth"});
}


async function deleteDriver(id) {
  const d = drivers.find(item => String(item.id) === String(id));
  if (!d) return;

  if (!confirm("Yakin ingin menghapus data driver " + d.name + "?")) return;

  const {error} = await db.from("drivers").delete().eq("id", id);

  if (error) {
    message("listMessage", "Gagal menghapus: " + error.message, "error");
    return;
  }

  message("listMessage", "Data driver berhasil dihapus.", "success");
  await loadDrivers();
}


function resetForm() {
  document.getElementById("driverId").value = "";
  [
    "nama","whatsapp","kabupaten","alamat","kendaraan","plat","sim",
    "jumlah_tamu","asal_tamu","tamu_menginap_di","status"
  ].forEach(key => document.getElementById(key).value = "");

  document.getElementById("formTitle").textContent = "Input Data Driver";
  document.getElementById("formMessage").textContent = "";
}

db.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_OUT" || !session) {
    document.getElementById("dashboard").classList.add("hidden");
    document.getElementById("loginPage").classList.remove("hidden");
  }
});

(async function startApp() {
  const {data} = await db.auth.getSession();
  if (data.session) {
    await checkAdmin(data.session.user);
  }
})();
</script>

</body>
</html>
