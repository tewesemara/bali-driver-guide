
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bali Driver & Guide</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f6f8;
      color: #263238;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 20px auto;
      background: #ffffff;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      margin: 0 0 10px;
      color: #087e72;
      font-size: 28px;
    }

    header p {
      margin: 0;
      color: #667085;
      line-height: 1.5;
    }

    .form-section {
      margin-bottom: 25px;
      padding: 20px;
      background: #f8fafb;
      border: 1px solid #e1e8ec;
      border-radius: 9px;
    }

    .form-section h2 {
      margin: 0 0 18px;
      padding-bottom: 10px;
      border-bottom: 2px solid #dce9e7;
      color: #087e72;
      font-size: 18px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input, select, textarea {
      display: block;
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5dc;
      border-radius: 6px;
      background: #ffffff;
      font-family: inherit;
      font-size: 15px;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #087e72;
      box-shadow: 0 0 0 2px rgba(8,126,114,0.12);
    }

    textarea {
      min-height: 85px;
      resize: vertical;
    }

    .required {
      color: #d93025;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #087e72;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #06665d;
    }

    button:disabled {
      background: #9aaba8;
      cursor: not-allowed;
    }

    #pesan {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 6px;
      line-height: 1.5;
      font-size: 14px;
    }

    #pesan.sukses {
      display: block;
      background: #e7f6ec;
      color: #176b35;
      border: 1px solid #b7e2c3;
    }

    #pesan.gagal {
      display: block;
      background: #fff0ef;
      color: #a12622;
      border: 1px solid #f3c1bd;
    }

    .catatan {
      margin-top: 18px;
      color: #667085;
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .container {
        margin: 5px auto;
        padding: 17px;
      }

      header h1 {
        font-size: 23px;
      }

      .form-section {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header>
      <h1>Bali Driver & Guide</h1>
      <p>Formulir Pendaftaran Driver dan Informasi Tamu</p>
    </header>

    <form id="formDriver">

      <!-- BAGIAN A -->
      <section class="form-section">
        <h2>A. Data Pribadi dan Kontak Driver</h2>

        <div class="form-group">
          <label for="nama">Nama Lengkap <span class="required">*</span></label>
          <input type="text" id="nama" required placeholder="Masukkan nama lengkap">
        </div>

        <div class="form-group">
          <label for="whatsapp">Nomor WhatsApp <span class="required">*</span></label>
          <input type="tel" id="whatsapp" required placeholder="Contoh: 081234567890">
        </div>

        <div class="form-group">
          <label for="kabupaten">Kabupaten <span class="required">*</span></label>
          <select id="kabupaten" required>
            <option value="">Pilih Kabupaten/Kota</option>
            <option>Denpasar</option>
            <option>Badung</option>
            <option>Gianyar</option>
            <option>Tabanan</option>
            <option>Bangli</option>
            <option>Klungkung</option>
            <option>Karangasem</option>
            <option>Buleleng</option>
            <option>Jembrana</option>
          </select>
        </div>

        <div class="form-group">
          <label for="alamat">Alamat Lengkap <span class="required">*</span></label>
          <textarea id="alamat" required placeholder="Masukkan alamat lengkap"></textarea>
        </div>
      </section>

      <!-- BAGIAN B -->
      <section class="form-section">
        <h2>B. Data Kendaraan dan SIM</h2>

        <div class="form-group">
          <label for="kendaraan">Jenis Kendaraan <span class="required">*</span></label>
          <select id="kendaraan" required>
            <option value="">Pilih Jenis Kendaraan</option>
            <option>Avanza</option>
            <option>Innova</option>
            <option>Innova Zenix</option>
            <option>Hiace</option>
            <option>Elf</option>
            <option>APV</option>
            <option>Bus</option>
            <option>Lainnya</option>
          </select>
        </div>

        <div class="form-group">
          <label for="plat">Nomor Polisi <span class="required">*</span></label>
          <input type="text" id="plat" required placeholder="Contoh: DK 1234 AB">
        </div>

        <div class="form-group">
          <label for="kapasitas">Kapasitas Penumpang <span class="required">*</span></label>
          <input type="number" id="kapasitas" required min="1" placeholder="Jumlah penumpang">
        </div>

        <div class="form-group">
          <label for="sim">Nomor SIM <span class="required">*</span></label>
          <input type="text" id="sim" required placeholder="Masukkan nomor SIM">
        </div>
      </section>

      <!-- BAGIAN C -->
      <section class="form-section">
        <h2>C. Data Tamu</h2>

        <div class="form-group">
          <label for="jumlah_tamu">Jumlah Tamu</label>
          <input type="number" id="jumlah_tamu" min="0" placeholder="Jumlah tamu">
        </div>

        <div class="form-group">
          <label for="asal_tamu">Asal Tamu</label>
          <input type="text" id="asal_tamu" placeholder="Contoh: Australia, Jepang, Indonesia">
        </div>

        <div class="form-group">
          <label for="tamu_menginap_di">Tamu Menginap di</label>
          <input type="text" id="tamu_menginap_di" placeholder="Nama hotel atau wilayah tempat menginap">
        </div>
      </section>

      <button type="submit" id="tombolSimpan">
        Simpan Data Driver
      </button>

      <div id="pesan" role="status"></div>

    </form>

    <p class="catatan">
      Bali Driver & Guide<br>
      Pastikan data yang dimasukkan sudah benar sebelum disimpan.
    </p>

  </main>

  <script>
    // KONEKSI SUPABASE
    const SUPABASE_URL = "https://wssbbcygkikepyhzudvf.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_22gv7q_JkIRTvCiUAUooQ_XSHdKUeq";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    // PROSES SIMPAN DATA
    const form = document.getElementById("formDriver");
    const tombol = document.getElementById("tombolSimpan");
    const pesan = document.getElementById("pesan");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      tombol.disabled = true;
      tombol.textContent = "Sedang menyimpan...";
      pesan.className = "";
      pesan.style.display = "none";

      const dataDriver = {
        nama: document.getElementById("nama").value.trim(),
        whatsapp: document.getElementById("whatsapp").value.trim(),
        kabupaten: document.getElementById("kabupaten").value,
        alamat: document.getElementById("alamat").value.trim(),
        kendaraan: document.getElementById("kendaraan").value,
        plat: document.getElementById("plat").value.trim(),
        kapasitas: Number(document.getElementById("kapasitas").value),
        sim: document.getElementById("sim").value.trim(),
        jumlah_tamu: document.getElementById("jumlah_tamu").value === ""
          ? null
          : Number(document.getElementById("jumlah_tamu").value),
        asal_tamu: document.getElementById("asal_tamu").value.trim() || null,
        tamu_menginap_di:
          document.getElementById("tamu_menginap_di").value.trim() || null
      };

      try {
        const { error } = await supabaseClient
          .from("drivers")
          .insert([dataDriver]);

        if (error) {
          throw error;
        }

        pesan.textContent = "Berhasil! Data driver sudah tersimpan di database.";
        pesan.className = "sukses";
        pesan.style.display = "block";

        form.reset();

      } catch (error) {
        console.error("Kesalahan menyimpan data:", error);

        pesan.textContent =
          "Data belum berhasil disimpan. Pesan kesalahan: " + error.message;

        pesan.className = "gagal";
        pesan.style.display = "block";

      } finally {
        tombol.disabled = false;
        tombol.textContent = "Simpan Data Driver";
      }
    });
  </script>

</body>
</html>
